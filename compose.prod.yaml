# Production: one server running everything. See DEPLOY.md.
#   docker compose -f compose.prod.yaml up -d --build
# Settings come from .env (copy deploy/.env.example). Only Caddy (80/443) is reachable from outside.
name: quire-prod

x-api: &api
  build:
    context: .
    dockerfile: quire-api/Dockerfile
  image: quire-api:latest
  environment:
    NODE_ENV: production
    PORT: "3000"
    DATABASE_URL: postgres://quire:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/quire
    WEB_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
    SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_SECURE: ${SMTP_SECURE:-false}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASS: ${SMTP_PASS:-}
    MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: quire
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quire -d quire"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies database migrations, then exits. The API waits for it on every start.
  migrate:
    <<: *api
    command: ["npx", "tsx", "src/cli/migrate.ts"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Caddy: TLS, the built web app, and the proxy to the API and co-editing.
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    image: quire-web:latest
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on:
      api:
        condition: service_healthy

  # Nightly pg_dump into ./backups (see deploy/backup.sh and DEPLOY.md for restoring).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: quire
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: quire
      BACKUP_HOUR: ${BACKUP_HOUR:-02}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/usr/local/bin/quire-backup:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/quire-backup"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
